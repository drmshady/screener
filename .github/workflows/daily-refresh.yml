name: Daily Refresh & Deploy

# Unattended cloud-CI replacement for the manual scripts/publish.ps1 chain
# (feature 011, US1, contracts/daily-automation.md). The hosted backend runs
# NO ingest of its own (010 preserved) -- this is the ONLY thing that ingests
# and republishes the snapshot. Idempotent / non-trading-day no-op via the
# new-session guard; abort-before-publish on any failed step so the last
# known-good snapshot stays live.

on:
  schedule:
    # After the US market close on weekdays (UTC). The guard's own
    # 22:00 UTC settle buffer (market_calendar.latest_completed_trading_day)
    # means this run always sees a session that buffer has already cleared.
    - cron: "0 23 * * 1-5"
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Rebuild & redeploy even with no new trading session (code-only deploy). Passes -SkipGuard."
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/drmshady/screener
  SPACE_ID: occlusion2/screener

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: pip install -e "backend[dev,export]"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx (layer caching)
        uses: docker/setup-buildx-action@v3

      # Guard -> incremental ingest -> integrity -> secret-scan -> build ->
      # push -> Factory-rebuild, ALL in one shared codepath also used by the
      # local owner publish (scripts/publish.ps1 -> scripts/publish_chain.ps1,
      # research.md Decision 5) -- one script run so a no-op session guard
      # short-circuits before any build/push/deploy. Secrets are read from
      # the environment only, never written to a file.
      - name: Run publish chain (guard, refresh, integrity, secret-scan, build, push, deploy)
        id: publish
        shell: pwsh
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          SCREENER_INDEPENDENT_QUOTE_API_KEY: ${{ secrets.SCREENER_INDEPENDENT_QUOTE_API_KEY }}
          # Without this the halal_terminal Shariah source silently never refreshes
          # (ingest_daily catches the missing-key error), so the compliant universe
          # bakes stale behind fresh prices. Add HALAL_TERMINAL_API_KEY as a repo secret.
          HALAL_TERMINAL_API_KEY: ${{ secrets.HALAL_TERMINAL_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Feature 014 runtime sentiment secrets are configured on the HF Space,
          # not written here: FINNHUB_API_KEY, ALPHAVANTAGE_API_KEY, GEMINI_API_KEY,
          # and optional ANTHROPIC_API_KEY.
          # Scheduled (cron) runs keep the new-session guard so non-trading days
          # are a documented no-op. A manual force_rebuild dispatch adds -SkipGuard
          # so a code-only deploy rebuilds even with no fresh session. Explicit
          # named args (no splat) to match the proven original invocation.
          if ('${{ inputs.force_rebuild }}' -eq 'true') {
            Write-Host 'force_rebuild=true -> adding -SkipGuard (code-only deploy).'
            ./scripts/publish_chain.ps1 -Image $env:IMAGE -SpaceId $env:SPACE_ID -Deploy -SkipGuard
          } else {
            ./scripts/publish_chain.ps1 -Image $env:IMAGE -SpaceId $env:SPACE_ID -Deploy
          }

      # Feature 018 (research Decision 3): after a REAL publish (a new session was
      # baked and the Space re-pulled the fresh image), trigger the owner's daily
      # portfolio brief on the hosted backend. Gated on the publish step's
      # `published == 'true'` output so a guard `noop` day makes no call and leaves
      # a clean run log. `force_rebuild` ⇒ published=true (code-only deploy).
      #
      # continue-on-error (FR-012): a brief-send failure is SURFACED (annotated
      # below) but MUST NOT fail or roll back the already-successful publish job --
      # the fresh snapshot stays live. The backend independently re-checks
      # idempotency + trading-day status, so a spurious call still cannot send a
      # duplicate or a non-trading-day brief.
      - name: Trigger daily portfolio brief
        id: brief
        if: steps.publish.outputs.published == 'true'
        continue-on-error: true
        shell: pwsh
        env:
          SCREENER_OWNER_SECRET: ${{ secrets.SCREENER_OWNER_SECRET }}
          # Hosted backend base URL (defaults to the HF Space URL derived from SPACE_ID).
          SCREENER_BACKEND_URL: ${{ secrets.SCREENER_BACKEND_URL }}
        run: |
          if (-not $env:SCREENER_OWNER_SECRET) {
            Write-Host 'SCREENER_OWNER_SECRET not set -- skipping brief trigger.'
            exit 0
          }
          $base = $env:SCREENER_BACKEND_URL
          if (-not $base) {
            # HF Space URL: https://<owner>-<space>.hf.space
            $slug = ($env:SPACE_ID -replace '/', '-')
            $base = "https://$slug.hf.space"
          }
          $uri = "$base/brief/run"
          $headers = @{ 'X-Owner-Secret' = $env:SCREENER_OWNER_SECRET; 'Content-Type' = 'application/json' }
          # Retry across the Space cold-start after a factory rebuild.
          $ok = $false
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            try {
              $resp = Invoke-RestMethod -Method Post -Uri $uri -Headers $headers -Body '{}' -TimeoutSec 60
              Write-Host "Brief run: status=$($resp.status) target=$($resp.target_session)"
              $ok = $true
              break
            } catch {
              Write-Host "Brief trigger attempt $attempt failed: $($_.Exception.Message)"
              Start-Sleep -Seconds (20 * $attempt)
            }
          }
          if (-not $ok) {
            "::warning title=Daily brief not sent::The brief-trigger call did not succeed after retries. The fresh snapshot remains live; re-run the brief manually if needed." | Out-Host
            exit 1
          }

      # GitHub already emails repo watchers on a failed scheduled workflow run
      # by default; this step adds the failing-step detail to the run summary
      # so the notification links straight to the cause (FR-004).
      - name: Annotate failure for the owner notification
        if: failure()
        shell: pwsh
        run: |
          "::error title=Daily refresh aborted::A step in the publish chain failed -- the last known-good snapshot remains live. See the failed step's log above for detail." | Out-Host
          "## Daily refresh FAILED`nThe last known-good snapshot is still live; no partial snapshot was published." >> $env:GITHUB_STEP_SUMMARY
