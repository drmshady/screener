[project]
name = "screener-backend"
version = "0.1.0"
description = "US Stock Screener MVP Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "pydantic>=2.7.4",
    "pandas>=2.2.2",
    "numpy>=1.26.4",
    "sqlalchemy>=2.0.30",
    "httpx>=0.27.0",
    "yfinance>=0.2.40",
    "sec-edgar-downloader>=5.1.0",
    "pyarrow>=16.1.0",
    "onnxruntime>=1.20.0",
    "tokenizers>=0.20.0",
    "google-genai>=1.0.0"
]

[project.optional-dependencies]
anthropic = [
    "anthropic>=0.45.0"
]
dev = [
    "pytest>=8.2.2",
    "hypothesis>=6.103.0",
    "schemathesis>=3.37.0",
    "ruff>=0.4.8",
    "mypy>=1.10.0",
    "black>=24.4.2"
]
export = [
    "torch>=2.5.0",
    "transformers>=4.46.0",
    "optimum[onnxruntime]>=1.23.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src"]
